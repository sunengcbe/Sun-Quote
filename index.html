<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quotation Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="bar"></span><div><h1>QUOTATION GENERATOR</h1><p>Create a professional quotation</p></div></div>
</header>

<main class="layout">
  <section class="form">
    <div id="errors" class="errors" hidden></div>

    <details class="card">
      <summary>Company Details <em>saved in this browser</em></summary>
      <div class="grid">
        <label class="full">Company Name<input data-c="name"></label>
        <label class="full">Address<textarea data-c="address" rows="2"></textarea></label>
        <label>GSTIN<input data-c="gstin"></label>
        <label>Phone / Contact<input data-c="phone"></label>
        <label>Email<input data-c="email" type="email"></label>
        <label>Website<input data-c="website"></label>
        <label class="full">Other Information<textarea data-c="other" rows="2"></textarea></label>
        <div class="full logo-row">
          <label class="filebtn">Upload Logo<input type="file" id="logoFile" accept="image/*" hidden></label>
          <img id="logoThumb" alt="" hidden><button type="button" class="link" id="logoRemove" hidden>Remove logo</button>
        </div>
      </div>
    </details>

    <div class="card">
      <h2>Customer Details</h2>
      <div class="grid">
        <label class="full">Company Name <b>*</b><input data-k="name"></label>
        <label class="full">Address<textarea data-k="address" rows="2"></textarea></label>
        <label>GSTIN<input data-k="gstin"></label>
        <label>Contact<input data-k="contact"></label>
        <label class="full">Email<input data-k="email" type="email"></label>
      </div>
    </div>

    <div class="card">
      <h2>Quotation Details</h2>
      <div class="grid">
        <label>Date <b>*</b><input type="date" data-q="date"></label>
        <label>Quotation Number<input data-q="no"></label>
      </div>
    </div>

    <div class="card">
      <div class="row"><h2>Items</h2><button type="button" class="btn-dark" id="addItem">+ Add Item</button></div>
      <div id="items"></div>
    </div>

    <div class="card">
      <h2>Notes</h2>
      <label>One note per line (numbered automatically)
        <textarea data-q="notes" rows="5" placeholder="Prices are exclusive of GST.&#10;Quotation is valid for 15 days from the date of issue."></textarea>
      </label>
    </div>

    <button type="button" class="generate" id="generate">GENERATE QUOTATION PDF</button>
  </section>

  <aside class="preview"><div class="pv-label">LIVE PREVIEW</div><div id="pvWrap"><div id="sheet" class="sheet"></div></div></aside>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
